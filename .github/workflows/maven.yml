name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    name: Build against Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        paper: ["26.2.build.129-stable", "26.3.build.134-beta"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B -ntp -Dpaper.version=${{ matrix.paper }} clean verify --file pom.xml
